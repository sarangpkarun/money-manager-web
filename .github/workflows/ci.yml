name: CI
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start local Supabase
        run: supabase start -x logflare,vector,imgproxy,edge-runtime,studio,realtime,storage-api
      - name: RLS isolation tests
        run: pnpm test:rls
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u src/lib/database.types.ts /tmp/database.types.ts

      - name: Build and budget checks (200 KB gz initial JS, no service_role in bundle)
        run: |
          pnpm build
          pnpm check:bundle
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
