<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f2f3f7;font-family:-apple-system,'SF Pro Text',Helvetica,Arial,sans-serif;color:#0f1720">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px">
      <tr><td style="padding:32px 28px">
        <h1 style="margin:0 0 12px;font-size:22px">Confirm your email</h1>
        <p style="margin:0 0 24px;line-height:1.5;color:#5b6573">Welcome to Money Manager. Tap the button to confirm {{ .Email }} and open your account.</p>
        <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;background:#2360e3;color:#ffffff;text-decoration:none;border-radius:12px;font-weight:600">Confirm my email</a></p>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#5b6573">If the button does not work, copy this link into your browser:<br><span style="word-break:break-all">{{ .ConfirmationURL }}</span></p>
        <p style="margin:24px 0 0;font-size:13px;color:#5b6573">Did not sign up? You can ignore this email; nothing happens until the link is used.</p>
      </td></tr>
    </table>
  </body>
</html>
